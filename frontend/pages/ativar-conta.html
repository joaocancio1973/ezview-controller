<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EzView Controller | Ativar Conta</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/style2.css" />
  </head>

  <body class="dark-bg">
    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-4">
      <div class="login-panel activation-panel">
        <div class="text-center mb-4">
          <h2 class="brand-title">Ativacao EzView</h2>
          <p class="brand-subtitle">Confirme seu acesso e defina sua senha inicial</p>
        </div>

        <div id="activationLoading" class="text-center activation-state">
          Validando convite...
        </div>

        <div id="activationError" class="alert alert-danger d-none"></div>

        <div id="activationSummary" class="activation-summary d-none">
          <div class="summary-row">
            <span>Morador</span>
            <strong id="summaryNome">-</strong>
          </div>
          <div class="summary-row">
            <span>Email</span>
            <strong id="summaryEmail">-</strong>
          </div>
          <div class="summary-row">
            <span>Condominio</span>
            <strong id="summaryCondominio">-</strong>
          </div>
          <div class="summary-row">
            <span>Unidade</span>
            <strong id="summaryUnidade">-</strong>
          </div>
          <div class="summary-row">
            <span>Papel</span>
            <strong id="summaryPapel">-</strong>
          </div>
          <div class="summary-row">
            <span>Expira em</span>
            <strong id="summaryExpira">-</strong>
          </div>
        </div>

        <form id="activationForm" class="d-none">
          <div class="mb-3">
            <label class="form-label">Nova senha</label>
            <input
              type="password"
              id="novaSenha"
              class="form-control dark-input"
              placeholder="Minimo de 6 caracteres"
              required
            />
          </div>

          <div class="mb-4">
            <label class="form-label">Confirmar senha</label>
            <input
              type="password"
              id="confirmarSenha"
              class="form-control dark-input"
              placeholder="Repita a senha"
              required
            />
          </div>

          <button id="activationBtn" class="btn btn-login w-100" type="submit">
            <span id="activationBtnText">Ativar minha conta</span>
            <span
              id="activationSpinner"
              class="spinner-border spinner-border-sm d-none"
            ></span>
          </button>
        </form>

        <div id="activationSuccess" class="d-none activation-success">
          <div class="alert alert-success mb-3">
            Sua conta foi ativada com sucesso.
          </div>
          <a href="/pages/login.html" class="btn btn-login w-100">Ir para o login</a>
        </div>

        <script src="../js/ativar-conta.js"></script>

        <div class="text-center mt-4">
          <small class="footer-text">© 2026 EzView Controller - Sinapse</small>
        </div>
      </div>
    </div>
  </body>
</html>
