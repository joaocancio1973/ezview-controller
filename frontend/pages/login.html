<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>EzView Controller | Login</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../css/style2.css" />
  </head>

  <body class="dark-bg">
    <div
      class="container d-flex justify-content-center align-items-center vh-100"
    >
      <div class="login-panel">
        <div class="text-center mb-4">
          <h2 class="brand-title">EzView Controller</h2>
          <p class="brand-subtitle">Plataforma de gestão condominial</p>
        </div>

        <form id="loginForm">
          <div id="loginError" class="alert alert-danger d-none"></div>

          <div class="mb-3">
            <label class="form-label">Email</label>
            <input
              type="email"
              id="email"
              class="form-control dark-input"
              placeholder="seu@email.com"
              required
            />
          </div>

          <div class="mb-3">
            <label class="form-label">Senha</label>
            <input
              type="password"
              id="senha"
              class="form-control dark-input"
              placeholder="••••••••"
              required
            />
          </div>

          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="rememberMe" />
            <label class="form-check-label text-muted"> Lembrar-me </label>
          </div>

          <button id="loginBtn" class="btn btn-login w-100" type="submit">
            <span id="loginBtnText">Acessar sistema</span>
            <span
              id="loginSpinner"
              class="spinner-border spinner-border-sm d-none"
            ></span>
          </button>
        </form>

        <script src="../js/login.js"></script>

        <div class="text-center mt-4">
          <small class="footer-text"> © 2026 EzView Controller - Sinapse</small>
        </div>
      </div>
    </div>
  </body>
</html>
